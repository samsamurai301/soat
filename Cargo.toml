[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/samsamurai301/soat"
publish = false

[workspace.dependencies]
soat-core = { path = "crates/soat-core" }
soat-module = { path = "crates/soat-module" }
soat-auth = { path = "crates/soat-auth" }
soat-tenancy = { path = "crates/soat-tenancy" }
soat-events = { path = "crates/soat-events" }
soat-webhooks = { path = "crates/soat-webhooks" }
soat-fields = { path = "crates/soat-fields" }
soat-files = { path = "crates/soat-files" }
soat-catalog = { path = "crates/soat-catalog" }
soat-inventory = { path = "crates/soat-inventory" }
soat-pricing = { path = "crates/soat-pricing" }
soat-customers = { path = "crates/soat-customers" }
soat-cart = { path = "crates/soat-cart" }
soat-tax = { path = "crates/soat-tax" }
soat-shipping = { path = "crates/soat-shipping" }
soat-payments = { path = "crates/soat-payments" }
soat-stripe = { path = "crates/soat-stripe" }
soat-mollie = { path = "crates/soat-mollie" }
soat-paypal = { path = "crates/soat-paypal" }
soat-promotions = { path = "crates/soat-promotions" }
soat-orders = { path = "crates/soat-orders" }
soat-checkout = { path = "crates/soat-checkout" }
soat-invoices = { path = "crates/soat-invoices" }
soat-notify = { path = "crates/soat-notify" }
soat-cms = { path = "crates/soat-cms" }
soat-i18n = { path = "crates/soat-i18n" }
soat-theme = { path = "crates/soat-theme" }
soat-storefront = { path = "crates/soat-storefront" }
soat-mcp = { path = "crates/soat-mcp" }
soat-admin = { path = "crates/soat-admin" }
soat-testing = { path = "crates/soat-testing" }
# Tracks Zapline main (newer than the crates.io release); Cargo.lock pins the exact commit.
zapline = { git = "https://github.com/samsamurai301/zapline", features = ["postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["derive"] }
serde_urlencoded = "0.7"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
