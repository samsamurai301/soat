{{> settings_tabs }}
<form method="post" action="{{ base }}/settings/email/settings" class="form">
  <div class="row">
    <label>Sender name <input name="sender_name" value="{{ email.sender_name }}" required></label>
    <label>Reply to <input type="email" name="reply_to" value="{{ email.reply_to }}"></label>
    <label>Staff notices to <input type="email" name="staff_email" value="{{ email.staff_email }}"></label>
  </div>
  <fieldset><legend>Emails sent</legend>
    {{#each templates }}<label class="check"><input type="checkbox" name="enabled" value="{{ key }}"{{#if enabled }} checked{{/if}}> <a href="{{ base }}/emails/{{ key }}">{{ key }}</a> <span class="muted">{{ description }}{{#if customized }} · reworded{{/if}}</span></label>{{/each}}
  </fieldset>
  <button class="button">Save</button>
</form>
<form method="post" action="{{ base }}/settings/email/cart-recovery" class="form">
  <fieldset><legend>Abandoned carts</legend>
    <label class="check"><input type="checkbox" name="enabled"{{#if recovery.enabled }} checked{{/if}}> Email buyers who leave a cart with their email, once, with a link back to it</label>
    <label>After (minutes) <input type="number" name="delay_minutes" min="15" max="10080" value="{{ recovery.delay_minutes }}" required></label>
  </fieldset>
  <button class="button">Save</button>
</form>
