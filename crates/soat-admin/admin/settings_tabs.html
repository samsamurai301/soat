<div class="head"><h1>Settings</h1></div>
<nav class="tabs" aria-label="Settings">{{#each tabs }}<a href="{{ base }}/settings/{{ area }}"{{#if current }} aria-current="page"{{/if}}>{{ label }}</a>{{/each}}</nav>
{{#if done }}<p class="notice" role="status">{{ done }}</p>{{/if}}
{{#if error }}<p class="error" role="alert">{{ error }}</p>{{/if}}
{{#if secret }}<div class="notice" role="status"><p>Your new {{ secret.what }}. Copy it now: it is not shown again.</p><pre class="code secret">{{ secret.value }}</pre></div>{{/if}}
