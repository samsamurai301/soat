[package]
name = "soat-files"
description = "Files and media of a shop: uploads checked by content, stored on disk or S3, served by signed links."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
soat-core.workspace = true
soat-module.workspace = true
soat-tenancy.workspace = true
zapline = { workspace = true, features = ["storage", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tokio = { version = "1", features = ["rt"] }
