[package]
name = "soat-mcp"
description = "The MCP server: Claude manages a shop through one tool per API operation, with writes held for approval."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
soat-core.workspace = true
soat-module.workspace = true
soat-tenancy.workspace = true
zapline = { workspace = true, features = ["openapi"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
tokio = { version = "1", features = ["time"] }
