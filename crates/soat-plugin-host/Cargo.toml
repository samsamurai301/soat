[package]
name = "soat-plugin-host"
description = "Runs WebAssembly plugins at SOAT's hook points, sandboxed and metered."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
soat-core.workspace = true
soat-plugin-api.workspace = true
serde_json.workspace = true
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
