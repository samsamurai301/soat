[package]
name = "soat-storefront"
description = "The storefront: server-rendered pages from the shop's theme, with htmx for the cart."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Blocks from installed apps on the storefront.
apps = ["dep:soat-apps"]
# Product reviews on product pages.
reviews = ["dep:soat-reviews"]
# Wishlists on product and account pages.
wishlists = ["dep:soat-wishlists"]
# Loyalty points and referrals in the account.
loyalty = ["dep:soat-loyalty"]
# Counts the pages shown for storefront analytics.
analytics = ["dep:soat-analytics"]
# The unsubscribe page of campaign emails.
marketing = ["dep:soat-marketing"]
# Subscribe on product pages and manage subscriptions in the account.
subscriptions = ["dep:soat-subscriptions"]
# Quick order by SKU, quotes and the buyer's company in the account.
b2b = ["dep:soat-b2b"]

[dependencies]
soat-core.workspace = true
soat-module.workspace = true
soat-tenancy.workspace = true
soat-files.workspace = true
soat-catalog.workspace = true
soat-cart.workspace = true
soat-customers.workspace = true
soat-shipping.workspace = true
soat-payments.workspace = true
soat-orders.workspace = true
soat-checkout.workspace = true
soat-cms.workspace = true
soat-theme.workspace = true
soat-i18n.workspace = true
soat-pricing.workspace = true
soat-apps = { workspace = true, optional = true }
soat-reviews = { workspace = true, optional = true }
soat-wishlists = { workspace = true, optional = true }
soat-loyalty = { workspace = true, optional = true }
soat-analytics = { workspace = true, optional = true }
soat-marketing = { workspace = true, optional = true }
soat-subscriptions = { workspace = true, optional = true }
soat-b2b = { workspace = true, optional = true }
zapline = { workspace = true, features = ["storage"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sqlx.workspace = true
