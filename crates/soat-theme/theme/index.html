{{#if blocks }}
{{> blocks }}
{{else}}
<section class="hero">
  <h1>{{ shop.name }}</h1>
  <p><a class="button" href="{{ root }}/search">{{ t.shop_all }}</a></p>

  <div class="grid">{{#each featured }}{{> product_card }}{{/each}}</div>
</section>
{{/if}}
