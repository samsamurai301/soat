<article class="product">
  <div class="gallery">
    {{#each product.images }}<img src="{{ url }}"{{#if srcset }} srcset="{{ srcset }}" sizes="(max-width: 800px) 100vw, 640px"{{/if}}{{#if width }} width="{{ width }}" height="{{ height }}"{{/if}} alt="{{ alt }}">{{/each}}
    {{#if product.images }}{{else}}<span class="no-image large"></span>{{/if}}
  </div>
  <div class="details">
    <h1>{{ product.title }}</h1>
    <p class="price">{{ product.price }}</p>
    <form class="buy" method="post" action="{{ root }}/cart/add" hx-post="{{ root }}/cart/add" hx-target="#cart-count" hx-swap="outerHTML">
      <input type="hidden" name="product_id" value="{{ product.id }}">
      {{#if product.variants }}
      <label>{{ t.option }}
        <select name="variant_id">{{#each product.variants }}<option value="{{ id }}">{{ title }} · {{ price }}</option>{{/each}}</select>
      </label>
      {{/if}}
      <label>{{ t.quantity }} <input type="number" name="quantity" value="1" min="1" max="99"></label>
      <button class="button" type="submit">{{ t.add_to_cart }}</button>
    </form>
    <div class="prose">{{ product.description | markdown }}</div>
    {{#if app_blocks.product }}<div class="soat-app-blocks" data-product="{{ product.id }}">{{#each app_blocks.product }}<div class="soat-app-block" data-soat-app="{{ app }}" data-block="{{ handle }}"></div>{{/each}}</div>{{/if}}
  </div>
</article>
<script type="application/ld+json">{{ product_ld | json }}</script>
