[package]
name = "soat-webhooks"
description = "Outbound webhooks: endpoints per shop, signed deliveries of domain events, retries and a delivery log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
soat-core.workspace = true
soat-module.workspace = true
soat-tenancy.workspace = true
soat-events.workspace = true
zapline.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
soat-auth.workspace = true
soat-catalog.workspace = true
soat-testing.workspace = true
tokio = { version = "1", features = ["full"] }
