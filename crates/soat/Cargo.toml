[package]
name = "soat"
description = "SOAT commerce server: one binary for API, admin, storefront and jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
soat-core.workspace = true
soat-module.workspace = true
soat-auth.workspace = true
soat-tenancy.workspace = true
soat-events.workspace = true
soat-webhooks.workspace = true
soat-fields.workspace = true
soat-files.workspace = true
soat-catalog.workspace = true
soat-inventory.workspace = true
soat-pricing.workspace = true
soat-customers.workspace = true
soat-cart.workspace = true
soat-tax.workspace = true
soat-shipping.workspace = true
soat-payments.workspace = true
soat-promotions.workspace = true
soat-orders.workspace = true
soat-checkout.workspace = true
soat-invoices.workspace = true
soat-notify.workspace = true
soat-cms.workspace = true
soat-i18n.workspace = true
soat-theme.workspace = true
soat-storefront.workspace = true
soat-mcp.workspace = true
soat-admin.workspace = true
soat-stripe = { workspace = true, optional = true }
soat-mollie = { workspace = true, optional = true }
soat-paypal = { workspace = true, optional = true }
zapline = { workspace = true, features = ["storage", "mail"] }

[features]
default = ["stripe", "mollie", "paypal"]
# Stripe payments (PaymentIntents, Connect, webhooks).
stripe = ["dep:soat-stripe"]
# Mollie payments: iDEAL, Bancontact, cards, Klarna and more.
mollie = ["dep:soat-mollie"]
# PayPal payments.
paypal = ["dep:soat-paypal"]

[dev-dependencies]
soat-testing.workspace = true
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
